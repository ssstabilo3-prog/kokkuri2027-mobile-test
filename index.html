<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173329"><title>こっくりさん2027｜放課後の教室</title><style>:root{color-scheme:light;--paper:#faf4e5;--ink:#292b22;--green:#314337;--red:#873b2e;--muted:#666454;--rule:#c9bda4;--type:1;--cell:20px}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:var(--ink);font:calc(16px * var(--type))/1.58 "Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;background:repeating-linear-gradient(0deg,#e3d9bd 0,#e3d9bd 1px,#e9dfc8 2px,#e9dfc8 5px)}
.shell{margin:0 auto;max-width:640px;min-height:100svh;background:var(--paper);border-inline:1px solid #ad9d7e;box-shadow:0 0 30px #493b251b}header{height:58px;margin:0 20px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:8px}button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation;min-height:48px;border:0;background:transparent}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #79621b;outline-offset:2px}header button{font-size:.9em}#home-link{display:flex;align-items:center;gap:9px;padding:0;font-weight:650;letter-spacing:.05em}.mark{display:inline-grid;place-items:center;width:25px;height:26px;color:var(--red);border:1.5px solid;border-radius:4px;transform:rotate(-4deg);font:700 20px/1 serif}.utility{padding:0 4px;text-decoration:underline;text-underline-offset:5px}main{padding:16px 18px 24px}section{max-width:520px;margin:auto;outline:none}h1,h2,#letters,.end-stamp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif}h2{font-size:1.55em;line-height:1.35;margin:12px 0 14px}p{margin:.65em 0 1em}.cover{position:relative;isolation:isolate;overflow:hidden;border:1px solid #b9a887;padding:23px 19px 16px;background:repeating-linear-gradient(transparent 0 31px,#94764c12 31px 32px),linear-gradient(130deg,#faf0d7,#eee1c3 65%,#f7e8c6);box-shadow:inset 0 0 0 5px #fbf3de,inset 0 0 0 6px #bdac8c}
#date-label,.micro,.footnote{color:var(--muted);font-size:.82em}.micro{letter-spacing:.12em}.cover h1{font-size:clamp(33px,9vw,55px);line-height:1.25;margin:20px 0 9px;letter-spacing:.055em;position:relative;z-index:1}.cover h1 span{display:block;color:var(--red);font-size:.39em;letter-spacing:.35em;margin-top:6px}.cover p{margin:22px 0;font-family:serif;letter-spacing:.1em}.cover-coin{pointer-events:none;position:absolute;z-index:-1;right:16px;top:105px;width:clamp(56px,16vw,86px);aspect-ratio:1;border:3px double #8e593a;outline:1px solid #b27a50;outline-offset:-6px;border-radius:50%;transform:rotate(-13deg);color:#805033;background:radial-gradient(ellipse at 30% 20%,#e9bb83,#c68d5e 70%,#a9704c);box-shadow:2px 4px 4px #796a4928;display:grid;align-content:center;justify-items:center;font:700 1.3em/1.1 serif}.cover-coin span{font-size:.69em}.primary,.secondary,.exit,.plain{display:block;width:100%;margin:10px 0 0;padding:10px 14px;border-radius:5px}.primary{background:var(--green);color:#fff9e9;font-weight:650}.primary b,.menu b{float:right}.secondary,.exit{border:1px solid var(--rule);background:#f5edda}.exit{border-color:#b48a70;color:var(--red);background:#fcf4e6}.plain{color:var(--muted);text-decoration:underline;text-underline-offset:4px}.menu{display:grid;gap:0;margin:10px 0 14px;border-block:1px solid var(--rule)}.menu button{padding:13px 7px;text-align:left;line-height:1.5}.menu button+button{border-top:1px solid #d6ccb7}.menu b{color:var(--red);font-size:1.2em}.menu button:hover,.tabs button:hover{background:#eadebd66}.footnote{margin:13px 3px}.tabs{display:flex;gap:4px}.tabs button{flex:1;border-bottom:2px solid var(--rule)}.tabs [aria-pressed="true"]{border-color:var(--red);color:var(--red);font-weight:700}.search{display:grid;gap:4px;margin:13px 0 10px;color:var(--muted);font-size:.87em}.search input{background:#fffaf0;border:1px solid #bdae90;border-radius:4px;width:100%;padding:10px;min-height:45px;font-size:16px}.note,blockquote{margin:14px 0;border-left:3px solid #a36c4b;background:#f0e6ce;padding:12px 15px}
.play-title{display:flex;justify-content:space-between;gap:8px;align-items:baseline}#phase{font-size:.87em;color:var(--red)}#asked{margin:6px 0 12px;font-size:1.18em}.board-paper{padding:0 1px;background:radial-gradient(ellipse at 50% 45%,#fff9e8,#f1e4c6);border:1px solid #ad9675;box-shadow:inset 0 0 0 3px #f7edd5,inset 0 0 0 4px #cebc9b;border-radius:4px}#board{display:block;width:100%;height:auto;overflow:visible;user-select:none;-webkit-user-select:none}.glyph text{fill:#303024;font:bold var(--cell) "Yu Mincho",serif}.glyph rect{fill:none;stroke:none}.glyph.lit rect{fill:#efd3ae;stroke:#a65338;stroke-width:1.2}.glyph.lit text{fill:#8b3124}.key text{font-size:15px;fill:#823d2a}.key rect{fill:#f1e1c3;stroke:#b99f79}.key.lit rect{fill:#f1c69a;stroke:#973d2d;stroke-width:2}.readout{margin:12px 0 0;padding:10px 4px 0;border-top:2px solid var(--green)}#letters{display:block;min-height:1.55em;margin:.12em 0;color:var(--green);font-weight:700;font-size:1.55em;letter-spacing:.08em;overflow-wrap:anywhere}#meaning{margin:4px 0 8px}#aside{color:var(--muted);font-size:.9em;border-left:2px solid var(--rule);padding-left:9px}#play-stop{position:sticky;bottom:max(4px,env(safe-area-inset-bottom));z-index:1}details{border-block:1px solid var(--rule);padding:8px 0}summary{cursor:pointer;min-height:44px;padding:10px 2px}li{margin-bottom:.5em}.end-stamp{font-size:32px;color:var(--red);border:3px double var(--red);width:52px;height:52px;text-align:center;transform:rotate(-6deg);margin:28px 0 14px}.toggle-value{float:right;color:var(--red);margin-left:8px}
@media(max-width:355px){main{padding:10px 10px 20px}header{height:50px;margin:0 12px}.cover{padding:19px 14px 14px}.cover-coin{right:12px;top:115px}}@media(max-height:550px) and (min-width:540px){.shell{max-width:980px}header{height:48px}.play-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}#play{max-width:870px}.board-paper{width:100%;max-width:340px;justify-self:center}.readout{margin-top:0}.cover-coin{right:32px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
body[data-screen="play"] main{padding-bottom:calc(24px + env(safe-area-inset-bottom))}#play-stop{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 32px));margin:0;background:#fcf4e6;box-shadow:0 0 0 4px #faf4e5,0 -3px 14px #4b362026}

body[data-screen="play"] .shell{
  min-height:100svh;
  background:linear-gradient(180deg,#173329ea 0 22%,#5b4128d9 42%,#76502ed9 100%);
  border:0;
  box-shadow:0 0 30px #21160f66;
}
body[data-screen="play"] header{
  margin-top:env(safe-area-inset-top);
  color:#fff4dc;
  border-color:#ffffff35;
}
body[data-screen="play"] header .mark{color:#f0c78d}
body[data-screen="play"] main{
  padding:clamp(8px,2.2svh,20px) clamp(12px,4vw,24px) calc(100px + env(safe-area-inset-bottom));
}
body[data-screen="play"] #play{
  max-width:500px;
}
body[data-screen="play"] .play-title{
  margin:0;
  padding:8px 12px 0;
  border-radius:4px 4px 0 0;
  background:#173329ed;
  color:#f8efd8;
}
body[data-screen="play"] #play-mode,
body[data-screen="play"] #phase{
  color:#f8efd8;
  font-size:.8em;
}
body[data-screen="play"] #asked{
  margin:0;
  padding:5px 12px 12px;
  color:#fff7e5;
  font-family:"Noto Serif CJK JP","Yu Mincho",serif;
  font-size:clamp(1.2rem,5vw,1.55rem);
  letter-spacing:.04em;
  background:#173329ed;
  border-radius:0 0 4px 4px;
  box-shadow:0 8px 18px #161b1390;
}
body[data-screen="play"] #ritual-line{
  margin:3px 0 0;
  min-height:38px;
  padding:4px 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#fff4dc;
  text-align:center;
  font-family:"Noto Serif CJK JP","Yu Mincho",serif;
  font-size:clamp(.88rem,3.7vw,1.05rem);
  line-height:1.4;
  letter-spacing:.035em;
  white-space:nowrap;
  text-shadow:0 1px 8px #07150f;
}
body[data-screen="play"] #ritual-line.flowing{animation:ritual-glide 1.35s ease both}
@keyframes ritual-glide{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){body[data-screen="play"] #ritual-line.flowing{animation:none}}
body[data-screen="play"] .play-grid{
  display:grid;
  gap:10px;
  margin:clamp(8px,1.6svh,16px) auto 0;
}
body[data-screen="play"] .board-paper{
  width:min(100%,390px);
  justify-self:center;
  padding:3px;
  overflow:hidden;
  border:1px solid #af956e;
  border-radius:2px;
  background:
    repeating-linear-gradient(3deg,#fffdf4 0,#fffdf4 10px,#f9f2df 11px,#fffdf4 16px),
    #fcf6e6;
  box-shadow:0 8px 18px #21160f70,inset 0 0 0 4px #f5e9ce,inset 0 0 0 5px #cbb58c;
  transform:rotate(-.18deg);
}
body[data-screen="play"] .glyph text{fill:#29251d}
body[data-screen="play"] .glyph.lit rect{fill:#f5d7aa;stroke:#a65338;stroke-width:1.35}
body[data-screen="play"] .glyph.lit text{fill:#8b3124}
body[data-screen="play"] .readout{
  display:grid;
  grid-template-columns:auto 1fr;
  align-items:center;
  column-gap:12px;
  row-gap:4px;
  min-height:56px;
  margin:0 auto;
  padding:0 4px;
  border:0;
  color:#fff5df;
}
body[data-screen="play"] .readout .micro{color:#fff2d7}
body[data-screen="play"] #letters{
  justify-self:start;
  min-height:0;
  margin:0;
  padding:1px 9px 3px;
  border:1px solid #48604d;
  border-radius:3px;
  color:#4a3221;
  background:#f6e9ce;
  box-shadow:1px 2px 2px #23170e60;
  font-size:clamp(1.3rem,6vw,1.8rem);
  line-height:1.35;
  letter-spacing:.14em;
}
body[data-screen="play"] #meaning,
body[data-screen="play"] #aside{
  grid-column:1 / -1;
  color:#fff7e5;
}
body[data-screen="play"] #meaning{margin:2px 0 0}
body[data-screen="play"] #aside{border-color:#e5cfaa}
body[data-screen="play"] #after{grid-column:1 / -1;margin:0}
body[data-screen="play"] #play-stop{
  position:static;
  transform:none;
  width:100%;
  min-height:54px;
  margin:8px 0 12px;
  padding:11px 14px;
  border:2px solid #314337;
  border-radius:8px;
  color:#26362c;
  background:#fbf3df;
  box-shadow:0 3px 10px #22170f35;
  font-family:"Noto Serif CJK JP","Yu Mincho",serif;
  font-weight:700;
  font-size:1.02em;
}
@media(max-height:720px) and (orientation:portrait){
  body[data-screen="play"] main{padding-top:5px}
  body[data-screen="play"] .play-grid{gap:4px;margin-top:5px}
  body[data-screen="play"] .readout{min-height:44px}
}
@media(max-width:355px){
  body[data-screen="play"] main{padding-inline:9px}
  body[data-screen="play"] .board-paper{padding:2px}
}
@media(orientation:landscape) and (max-height:520px){
  body[data-screen="play"] main{padding-block:5px}
  body[data-screen="play"] .play-grid{grid-template-columns:minmax(0,1fr) minmax(150px,.55fr);align-items:center;gap:14px;margin-top:6px}
  body[data-screen="play"] .board-paper{width:min(100%,340px)}
  body[data-screen="play"] .readout{align-content:center}
}
@media(prefers-reduced-motion:reduce){
  body[data-screen="play"] .board-paper{transform:none}
}

/* Requested compact, fixed play-screen layout. */
.cover h1{margin-bottom:0}
.cover h1 span{display:none}
body[data-screen="play"]{overflow:hidden}
body[data-screen="play"] .shell{height:100dvh;min-height:0;overflow:hidden}
body[data-screen="play"] header{height:calc(50px + env(safe-area-inset-top));margin-top:0;padding-top:env(safe-area-inset-top)}
body[data-screen="play"] main{height:calc(100dvh - 50px - env(safe-area-inset-top));overflow:hidden;padding:4px 12px calc(130px + env(safe-area-inset-bottom))}
body[data-screen="play"] #play{height:100%;display:flex;flex-direction:column;min-height:0}
body[data-screen="play"] .play-title{flex:0 0 20px;min-height:20px;padding:0 8px;align-items:center}
body[data-screen="play"] #phase{display:none}
body[data-screen="play"] #asked{flex:0 0 auto;max-height:3.7em;overflow:hidden;margin:2px 0 0;padding:3px 8px 7px;font-size:clamp(1rem,4.8vw,1.38rem);line-height:1.23}
body[data-screen="play"] #ritual-line{flex:0 0 30px;height:30px;min-height:30px;margin:0;padding:2px 4px;font-size:clamp(.82rem,3.7vw,1rem)}
body[data-screen="play"] .play-grid{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;min-height:0;margin:3px auto 0}
body[data-screen="play"] .board-paper{flex:0 0 auto;width:min(100%,390px,max(140px,calc((100dvh - 430px)*.87)));padding:2px}
body[data-screen="play"] .readout{flex:0 0 170px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:18px 38px 64px 38px;gap:3px;width:100%;height:170px;min-height:170px;margin:0 auto;padding:0 4px;overflow:hidden;text-align:left}
body[data-screen="play"] .readout .micro{height:18px;line-height:18px;text-align:left}
body[data-screen="play"] #letters{width:100%;height:38px;min-height:38px;max-height:38px;justify-self:stretch;align-self:stretch;box-sizing:border-box;margin:0;padding:1px 8px 3px;overflow:hidden;white-space:nowrap;text-align:left;font-size:clamp(1rem,5.8vw,1.45rem);line-height:32px;letter-spacing:.08em}
body[data-screen="play"] #meaning{height:64px;max-height:64px;min-height:64px;margin:0;overflow:hidden;font-size:14px;line-height:1.43;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
body[data-screen="play"] #aside{height:38px;max-height:38px;min-height:38px;margin:0;overflow:hidden;font-size:12px;line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
body[data-screen="play"] #meaning[hidden],body[data-screen="play"] #aside[hidden]{display:-webkit-box!important;visibility:hidden}
body[data-screen="play"] #after{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 72px);transform:translateX(-50%);z-index:20;width:min(500px,calc(100% - 32px));height:48px;min-height:48px;margin:0;padding:8px 12px}
body[data-screen="play"] #after[hidden]{display:block!important;visibility:hidden;pointer-events:none}
body[data-screen="play"] #play-stop{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);z-index:19;width:min(500px,calc(100% - 32px));height:54px;min-height:54px;margin:0;padding:8px 12px}

const ritualBeat = 2200;
function smoothFraction(value) {
  const u = Math.max(0, Math.min(1, value));
  return u*u*(3-2*u);
}
function planStroke(from, to, phase, first, reduced) {
  const dx=to.x-from.x, dy=to.y-from.y, distance=Math.hypot(dx,dy);
  if(reduced)return {from,to,dx,dy,distance,reduced,travel:120,hold:100};
  const turn=phase%1, reach=Math.min(distance,240)/240;
  const travel=Math.round(1010+350*reach+85*turn+(first?90:0));
  return {
    from,to,dx,dy,distance,reduced,travel,hold:Math.round(280+90*turn),
    hesitant:first||turn>.46, dragAt:.32+.20*turn,
    side:(turn<.5?-1:1)*Math.min(5.5, .13*distance),
    recoil:Math.min(.038,1.3/Math.max(1,distance)), turn
  };
}
function strokePosition(s, progress) {
  const p=Math.max(0,Math.min(1,progress));
  if(s.reduced){
    const q=smoothFraction(p);
    return {x:s.from.x+s.dx*q,y:s.from.y+s.dy*q};
  }
  if(s.distance===0){
    // Repeated kana still have a small release and a second landing.
    const lift=Math.sin(Math.PI*p)**2;
    return {x:s.from.x+(s.turn<.5?-1:1)*1.1*lift,y:s.from.y-.65*lift};
  }
  let q;
  if(s.hesitant) {
    const pause=s.dragAt, reached=pause+.035;
    if(p<=pause)q=reached*smoothFraction(p/pause);
    else if(p<pause+.17)q=reached-s.recoil*smoothFraction((p-pause)/.17);
    else q=reached-s.recoil+(1-reached+s.recoil)*smoothFraction((p-pause-.17)/(1-pause-.17));
  }else{
    // Some letters come more readily, so the pause never becomes a metronome.
    q=smoothFraction(p)*(.83+.17*p);
  }
  const side=s.side*Math.sin(Math.PI*q)*(1-.56*q);
  return {x:s.from.x+s.dx*q-s.dy/s.distance*side, y:s.from.y+s.dy*q+s.dx/s.distance*side};
}
function paceLongReading(strokes, returning){
  // Keep the weight of the first movement. Scale only the remaining travel
  // and rests to a shared time budget so long words do not drag.
  const [first,...remaining]=strokes;
  const limit=returning?11700:13800;
  const available=limit-first.travel-first.hold;
  const duration=remaining.reduce((total,s)=>total+s.travel+s.hold,0);
  const scale=Math.min(returning ? .90 : 1, available/duration);
  for(const s of remaining){
    s.travel=Math.round(s.travel*scale);
    s.hold=Math.round(s.hold*scale);
  }
}
function begin(spec){

  unlockSound();cancelFlight();
  const reduced=settings.reduce, seed=Math.random();
  let origin=TORII;
  const strokes=path.map(([key],index)=>{
    const target=coords.get(key);
    const stroke=planStroke(origin,target,seed+index*.61803399,index===0,reduced);
    origin=target;
    return stroke;
  });
  const longStandard=!reduced&&path.length>=9;
  if(longStandard)paceLongReading(strokes,read('longReadingCompleted')===true);
  const start=performance.now();
  const run={spec,idx:0,longStandard,ritualStep:-1,awaitingStart:true};let legStart=null,landedAt=null;
  run.startFlight=()=>{if(session!==run||!run.awaitingStart||run.ritualStep<2)return;run.awaitingStart=false;legStart=performance.now();$('ritual-line').textContent='';$('ritual-line').classList.remove('flowing');};
  session=run;openScreen('play');$('play-mode').textContent=spec.mode;$('asked').textContent=spec.question;
  $('letters').textContent='';$('meaning').hidden=$('aside').hidden=$('after').hidden=true;
  $('phase').textContent='';$('answer-live').textContent='';$('ritual-line').textContent='';$('ritual-line').classList.remove('flowing');$('play-stop').hidden=false;$('coin-hit').style.pointerEvents='all';$('play-stop').disabled=false;$('play-stop').textContent='お帰りいただく';
  function step(now){
    if(session!==run)return;
    if(run.awaitingStart){
      const ritualLines=['こっくりさん、こっくりさん。','どうぞおいでください。','唱え終わったら十円玉に触れてください'];
      const ritualIndex=Math.min(2,Math.floor(Math.max(0,now-start)/ritualBeat));
      if(ritualIndex!==run.ritualStep){
        run.ritualStep=ritualIndex;
        const ritual=$('ritual-line');ritual.classList.remove('flowing');ritual.textContent=ritualLines[ritualIndex];void ritual.offsetWidth;ritual.classList.add('flowing');
      }
      place(TORII.x,TORII.y);
      frame=requestAnimationFrame(step);return;
    }else{
      const s=strokes[run.idx], [key,glyph]=path[run.idx], elapsed=now-legStart;
      if(elapsed<s.travel){

        if(landedAt===null){
          place(s.to.x,s.to.y);light(key);$('letters').textContent+=glyph;
          fitAnswerText();tick();landedAt=now;
        }
        if(now-landedAt>=s.hold){
          run.idx++;
          if(run.idx===path.length){frame=0;finish(run);return;}
          legStart=now;landedAt=null;
        }

  }

}
function finish(run){

  if(run.longStandard)write('longReadingCompleted',true);

function returnSession(){

let era='adult',questionPage=0;

const lastWordByQuestion=new Map(), explanationVisits=new Map();
function localContext(date) {
  const month=date.getMonth(), hour=date.getHours();
  return {
    season:['winter','spring','summer','autumn'][Math.floor(((month+1)%12)/3)],
    time:hour<5||hour>=20?'night':hour<11?'morning':hour<16?'noon':'evening'
  };
}
function questionPool(id, date) {
  const ordinary=game.routes[id].slice(), rare=[];
  const {season,time}=localContext(date);
  for(const row of game.extras.specials[id]||[]){
    if(row.chance)rare.push(row);
    else if(row.season===season||row.time===time)ordinary.push(row.id);
  }
  return {ordinary,rare};
}
function drawQuestion(id, date) {
  const {ordinary,rare}=questionPool(id,date), prev=lastWordByQuestion.get(id);
  const fresh=aid=>game.answers[aid][0]!==prev;
  const eligibleRare=rare.filter(r=>fresh(r.id));
  if(eligibleRare.length){
    const roll=Math.random();let limit=0;
    for(const r of eligibleRare){limit+=r.chance;if(roll<limit)return r.id;}
  }
  const freshOrdinary=ordinary.filter(fresh);
  const pool=freshOrdinary.length?freshOrdinary:ordinary;
  return pool[Math.floor(Math.random()*pool.length)];
}
function chooseQuestion(id){
  const date=new Date(), aid=drawQuestion(id,date), [word,base]=game.answers[aid];
  const context=localContext(date);
  const seasonal=game.extras.seasonal_text[id]?.[aid]?.find(r=>r.season===context.season||r.time===context.time);
  const lines=[seasonal?.text||base,...(game.extras.variants[aid]||[])], visits=explanationVisits.get(aid)||0;
  begin({mode:'放課後の質問',question:game.questions[id].text,word,meaning:lines[visits%lines.length],friend:true,
    commit:()=>{
      lastWordByQuestion.set(id,word);
      if(lines.length>1)explanationVisits.set(aid,(visits+1)%lines.length);
    },
    nextLabel:'もう一問、聞いてみる',next:()=>questionScreen(false)});
}

function chooseUnseenQuiz(total,persisted,session,random=Math.random){
  const all=Array.from({length:total},(_,i)=>i),valid=i=>Number.isInteger(i)&&i>=0&&i<total;
  const seen=new Set([...(persisted?.seen||[]),...(session?.seen||[])].filter(valid));
  const previous=valid(session?.last)?session.last:(valid(persisted?.last)?persisted.last:null);
  let available=all.filter(i=>!seen.has(i)),wrapped=false;
  if(!available.length){wrapped=true;available=all.filter(i=>i!==previous);}
  if(!available.length)available=all;
  const pick=Math.min(available.length-1,Math.floor(random()*available.length));
  const index=available[Math.max(0,pick)];
  return {index,seen:[...(wrapped?[]:seen),index],last:index,wrapped};
}
// QUIZ_DRAW_FUNCTION_END
const quizHistoryKey=prefix+'quiz-history';
let quizStorageAvailable=diskAvailable;
let quizSessionState={seen:[],last:null};
function nextUnseenQuizIndex(){
  const total=game.quizzes.length;let persisted={seen:[],last:null};
  if(quizStorageAvailable){
    try{
      const raw=localStorage.getItem(quizHistoryKey);
      if(raw){const saved=JSON.parse(raw);if(saved?.total===total&&Array.isArray(saved.seen))persisted={seen:saved.seen,last:saved.last};}
    }catch{quizStorageAvailable=false;}
  }
  const selected=chooseUnseenQuiz(total,persisted,quizSessionState);
  if(selected.wrapped)quizSessionState={seen:[],last:null};
  quizSessionState.seen=[...new Set([...quizSessionState.seen,selected.index])];
  quizSessionState.last=selected.index;
  if(quizStorageAvailable){
    try{localStorage.setItem(quizHistoryKey,JSON.stringify({total,seen:selected.seen,last:selected.last}));}
    catch{quizStorageAvailable=false;}
  }
  return selected.index;
}
